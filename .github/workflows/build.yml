name: Build
# Noja Trade's copy: one image, PHP 8.3 on amd64, published to GHCR. The PHP
# version is the phpVersion default in src/docker/Dockerfile; bumping it there
# publishes ghcr.io/nojatrade/nginx-php-fpm:<version> and moves :8.3.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nojatrade/nginx-php-fpm

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the PHP version
        id: php
        run: echo "version=$(sed -n 's/^ARG phpVersion=//p' src/docker/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          file: ./src/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.php.outputs.version }}
            ${{ env.IMAGE }}:8.3
